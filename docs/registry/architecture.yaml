# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: scripting_language
    status: active
    api: GDScript (.gd files)
    not: "C# (.cs files), mixed GDScript/C# codebase"
    adr: docs/architecture/adr-0002-gdscript-language-choice.md
    reason: "No compilation step (faster iteration), smaller mobile exports (no .NET runtime), sufficient performance for idle game scope"
    referenced_by:
      - docs/architecture/adr-0002-gdscript-language-choice.md
    added: 2026-05-16
    revised: ""

  - purpose: abstract_base_resources
    status: active
    api: "@abstract decorator (GDScript 4.5+)"
    not: "Convention-only base classes without enforcement"
    adr: docs/architecture/adr-0002-gdscript-language-choice.md
    reason: "Enforces subclass contracts for BaseHabitatBonus, BaseFoodEffect, BaseExpeditionZone without needing C# interfaces"
    referenced_by:
      - docs/architecture/adr-0002-gdscript-language-choice.md
    added: 2026-05-16
    revised: ""

  - purpose: balance_data_loading
    status: active
    api: "FileAccess.get_file_as_string('res://assets/data/balance.json') + JSON.parse_string()"
    not: "preload(), .tres resource files, hardcoded GDScript constants"
    adr: docs/architecture/adr-0004-balance-json.md
    reason: "JSON is human-readable, diff-friendly, and editable without touching code. Enables designer-friendly balance iteration."
    referenced_by:
      - docs/architecture/adr-0004-balance-json.md
    added: 2026-05-16
    revised: ""

  - purpose: allele_representation
    status: active
    api: "String keys defined as constants in AlleleCatalogue (src/core/genetics/allele_catalogue.gd)"
    not: "Integer enum indices, inline string literals in game logic"
    adr: docs/architecture/adr-0006-genetics-allele-model.md
    reason: "String keys are human-readable in savegame.json and logs, safe to reorder, and debuggable without a lookup table. Integer indices corrupt saves if the catalogue is renumbered."
    referenced_by:
      - docs/architecture/adr-0006-genetics-allele-model.md
    added: 2026-05-16
    revised: ""

  - purpose: save_file_format
    status: active
    api: "JSON serialised to user://savegame.json via FileAccess.store_string()"
    not: "ResourceSaver.save(), ConfigFile, binary formats"
    adr: docs/architecture/adr-0008-firebase-local-first-save.md
    reason: "JSON matches Firebase Realtime DB native format — no translation needed. Human-readable and git-diffable. Consistent with balance.json approach."
    referenced_by:
      - docs/architecture/adr-0008-firebase-local-first-save.md
    added: 2026-05-16
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
