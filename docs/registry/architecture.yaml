# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: boot_sequence
    status: active
    pattern: direct_call
    producer: Godot Project Settings (autoload order)
    consumers:
      - all autoloads
      - all scenes
    adr: docs/architecture/adr-0001-autoload-boot-sequence.md
    signal_signature: "N/A — enforced by registration order: EventBus(1) → TimeManager(2) → EconomyManager(3) → GameState(4) → SaveSystem(5) → SceneManager(6)"
    referenced_by:
      - docs/architecture/adr-0001-autoload-boot-sequence.md
    added: 2026-05-16
    revised: ""

  - contract: dirty_flag_save
    status: active
    pattern: direct_call
    producer: any system mutating GameState
    consumers:
      - SaveSystem (polls is_dirty every 30s and on app background)
    adr: docs/architecture/adr-0001-autoload-boot-sequence.md
    signal_signature: "GameState.mark_dirty() → void; SaveSystem.save_game() triggered on next poll"
    referenced_by:
      - docs/architecture/adr-0001-autoload-boot-sequence.md
    added: 2026-05-16
    revised: ""

  - contract: cross_system_communication
    status: active
    pattern: event_bus
    producer: any system in any layer
    consumers:
      - any system in an equal or higher layer
    adr: docs/architecture/adr-0003-eventbus-signals.md
    signal_signature: "EventBus.<signal_name>.emit(args) — see full catalogue in ADR-0003"
    referenced_by:
      - docs/architecture/adr-0003-eventbus-signals.md
    added: 2026-05-16
    revised: ""

  - contract: idle_production
    status: active
    pattern: direct_call
    producer: IdleProductionSystem
    consumers:
      - TimeManager tick handler (calls get_tick_earnings() every second)
      - SaveSystem boot sequence (calls calculate_offline_earnings() on resume)
    adr: docs/architecture/adr-0007-idle-production-offline.md
    signal_signature: "IdleProductionSystem.get_tick_earnings() → EarningsReport; IdleProductionSystem.calculate_offline_earnings(delta_seconds: float, was_backgrounded: bool) → EarningsReport. Callers pass result to EconomyManager.add() — IdleProductionSystem never calls EconomyManager directly."
    referenced_by:
      - docs/architecture/adr-0007-idle-production-offline.md
    added: 2026-05-16
    revised: ""

  - contract: firebase_sync
    status: active
    pattern: direct_call
    producer: SaveSystem
    consumers:
      - FirebaseAdapter (injected; wraps SDK or REST calls)
    adr: docs/architecture/adr-0008-firebase-local-first-save.md
    signal_signature: "FirebaseAdapter.push_save_async(data: Dictionary) → void (fire-and-forget, never awaited on main thread); FirebaseAdapter.fetch_save() → Dictionary (awaited only at boot, before first scene)."
    referenced_by:
      - docs/architecture/adr-0008-firebase-local-first-save.md
    added: 2026-05-16
    revised: ""

