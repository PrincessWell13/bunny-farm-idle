# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: calling_later_autoload_in_ready
    status: active
    description: "An autoload's _ready() must not call any autoload registered after it in the boot sequence. EventBus(1) may call nothing. TimeManager(2) may call EventBus only. Etc."
    why: "Violates the guaranteed boot order. If autoload N calls autoload N+2, N+2 may not have run _ready() yet, causing null-reference crashes that are intermittent and hard to reproduce."
    adr: docs/architecture/adr-0001-autoload-boot-sequence.md
    added: 2026-05-16

  - pattern: bypassing_mark_dirty
    status: active
    description: "Code must never write GameState.is_dirty = true directly. Always call GameState.mark_dirty() instead."
    why: "mark_dirty() is the hook point for any future save-throttling or change-tracking logic. Direct property writes bypass it silently."
    adr: docs/architecture/adr-0001-autoload-boot-sequence.md
    added: 2026-05-16

  - pattern: csharp_files_in_src
    status: active
    description: "No .cs files may exist in src/. GDScript is the sole implementation language."
    why: "Mixed GDScript/C# codebases require Variant marshalling at the boundary, add .NET runtime to exports (+20-30MB), and double the tooling surface area."
    adr: docs/architecture/adr-0002-gdscript-language-choice.md
    added: 2026-05-16

  - pattern: untyped_variables_in_src
    status: active
    description: "All variables, parameters, and return types in src/ must have explicit type annotations. Untyped code (var x, func foo()) is only permitted in prototypes/."
    why: "Untyped GDScript cannot be optimised by the compiler and produces runtime errors instead of editor warnings. Static typing is required for GdUnit4 test reliability."
    adr: docs/architecture/adr-0002-gdscript-language-choice.md
    added: 2026-05-16

  - pattern: variadic_args_in_game_logic
    status: active
    description: "Variadic args (Variant...) must not be used in game logic interfaces — only in debug/logging utilities."
    why: "Variadic parameters bypass static type checking. Game logic interfaces must be fully typed so the compiler catches misuse at authoring time."
    adr: docs/architecture/adr-0002-gdscript-language-choice.md
    added: 2026-05-16

  - pattern: string_based_signal_connect
    status: active
    description: "Never use connect('signal_name', obj, 'method'). Always use typed callable: EventBus.signal_name.connect(callable)."
    why: "String-based connect() was deprecated in Godot 4.0. It bypasses type checking and fails silently on typos."
    adr: docs/architecture/adr-0003-eventbus-signals.md
    added: 2026-05-16

  - pattern: upward_direct_method_calls
    status: active
    description: "A system must never call a method on a system in a higher architecture layer. Presentation may not call Feature methods that mutate state. Feature may not call Presentation at all."
    why: "Upward calls create circular dependencies and make lower-layer unit tests dependent on upper-layer classes being instantiated. EventBus signals are the only valid upward communication channel."
    adr: docs/architecture/adr-0003-eventbus-signals.md
    added: 2026-05-16

  - pattern: hardcoded_balance_values
    status: active
    description: "No .gd file in src/ may contain a magic number representing a game balance value. The only permitted numeric literals in src/ are: array/loop indices, boolean-like flags (0/1), and engine constants (e.g., Color.WHITE). All balance values must be loaded from assets/data/balance.json."
    why: "Hardcoded balance values require a code edit, test run, and rebuild for every tuning change. Externalising to JSON enables balance iteration without touching code."
    adr: docs/architecture/adr-0004-balance-json.md
    added: 2026-05-16

  - pattern: direct_rabbitdata_mutation
    status: active
    description: "No .gd file outside src/core/rabbit_system.gd may assign to a RabbitData field directly (e.g., rabbit.hunger = 50, rabbit.stage = ...). All mutations must go through RabbitSystem methods."
    why: "RabbitData immutability from outside RabbitSystem keeps the lifecycle state machine reliable and ensures SaveSystem serialises consistent state. Direct writes bypass the state machine and mark_dirty() hook."
    adr: docs/architecture/adr-0005-rabbitdata-resource.md
    added: 2026-05-16

  - pattern: inline_allele_strings
    status: active
    description: "Allele key strings must always come from AlleleCatalogue constants (e.g., AlleleCatalogue.COLORS[0]), never as inline literals (e.g., 'gold', 'fast_eater') in game logic."
    why: "Inline string literals create invisible coupling to the catalogue. A rename in AlleleCatalogue breaks inline strings silently with no compile error. Constants are refactor-safe."
    adr: docs/architecture/adr-0006-genetics-allele-model.md
    added: 2026-05-16

