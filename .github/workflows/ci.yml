name: CI — GdUnit4 Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run GdUnit4 Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run GdUnit4 tests
        uses: godot-gdunit-labs/gdUnit4-action@v1.3.1
        with:
          godot-version: '4.3'
          godot-status: 'stable'
          version: 'latest'
          paths: 'res://tests/unit,res://tests/integration'
          timeout: 15
          publish-report: true
          upload-report: true
